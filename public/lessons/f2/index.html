<!doctype html>
<html lang="ja">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>講座一覧（F2 命令的に画面を作る）</title>
        <style>
            body {
                font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif;
                color: #374151;
                margin: 32px;
            }
            .toolbar {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                align-items: center;
                margin-bottom: 16px;
            }
            .toolbar button {
                border: 1px solid #d1d5db;
                background: #fff;
                border-radius: 999px;
                padding: 4px 14px;
                white-space: nowrap;
                cursor: pointer;
            }
            .toolbar button.is-selected {
                background: #e9f0f9;
                border-color: #9db8dc;
            }
            #course-list {
                list-style: none;
                padding: 0;
                display: grid;
                gap: 8px;
            }
            #course-list li {
                border: 1px solid #e5e7eb;
                border-radius: 10px;
                padding: 12px 16px;
            }
            .status {
                color: #6b7280;
                font-size: 13px;
                margin-left: 8px;
            }
        </style>
    </head>
    <body>
        <h1>講座一覧</h1>

        <div class="toolbar">
            <!-- Step 1 で、ステータスの絞り込みのボタンをここに足します -->
            <span id="course-count"></span>
        </div>

        <p id="empty-message" hidden>条件に合う講座はありません。</p>

        <ul id="course-list"></ul>

        <script type="module" src="./app.js"></script>
    </body>
</html>
