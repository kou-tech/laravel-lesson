            type: string
          example: '{{Origin}}'
      responses: {}
      tags:
        - Lesson06
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
            example:
              email: test@example.com
              password: password
  /logout:
    post:
      summary: ログアウト
      parameters:
        - name: X-XSRF-TOKEN
