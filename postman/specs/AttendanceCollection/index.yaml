      summary: 講座削除
      parameters:
        - name: X-XSRF-TOKEN
          in: header
          required: false
          deprecated: false
          schema: {}
          example: '{{XSRF-TOKEN}}'
        - name: Referer
          in: header
          required: false
          deprecated: false
          schema: {}
          example: '{{Referer}}'
        - name: Origin
