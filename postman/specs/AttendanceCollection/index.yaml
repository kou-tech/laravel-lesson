        - Lesson01
  /api/fruits/{fruitId}:
    get:
      summary: fruits_id
      responses: {}
      tags:
        - Lesson01
    parameters:
      - name: fruitId
        in: path
        required: true
        deprecated: false
        schema: {}
        example: '1'
  /api/users:
    get:
      summary: users
      responses: {}
      tags:
        - Lesson02
  /api/users/{userId}:
    patch:
      summary: users_id
      parameters:
        - name: X-XSRF-TOKEN
          in: header
          required: false
          deprecated: false
          schema: {}
          example: '{{XSRF-TOKEN}}'
        - name: Referer
          in: header
          required: false
          deprecated: false
          schema: {}
          example: '{{Referer}}'
