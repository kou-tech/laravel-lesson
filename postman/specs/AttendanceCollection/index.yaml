        - name: Referer
          in: header
          required: false
          deprecated: false
          schema: {}
          example: '{{Referer}}'
        - name: Origin
          in: header
          required: false
          deprecated: false
          schema: {}
          example: '{{Origin}}'
      responses: {}
      tags:
        - Lesson11
      requestBody:
        content:
          application/json:
            schema:
              type: object
    parameters:
      - name: courseId
        in: path
        required: true
        deprecated: false
        schema: {}
        example: '27'
