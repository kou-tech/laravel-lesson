      - name: courseId
        in: path
        required: true
        schema:
          type: integer
        example: '1'
    patch:
      summary: 講座更新
      parameters:
        - name: X-XSRF-TOKEN
          in: header
          required: false
          deprecated: false
          schema: {}
          example: '{{XSRF-TOKEN}}'
