  /api/courses:
    get:
      summary: 講座一覧
      parameters:
        - name: Referer
          in: header
          required: false
          deprecated: false
          schema: {}
          example: '{{Referer}}'
        - name: Origin
          in: header
          required: false
          deprecated: false
          schema: {}
          example: '{{Origin}}'
